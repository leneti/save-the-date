[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/save-the-date.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = 'attachment; filename="emilijos-ir-dominyko-vestuves.ics"'

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
