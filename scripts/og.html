<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Pinyon Script'; font-weight: 400; src: url('../site/assets/fonts/pinyon-script-400-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant Garamond'; font-weight: 500; src: url('../site/assets/fonts/cormorant-garamond-500-latin.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(ellipse at 30% 40%, #4b573c 0%, #3f4a32 55%, #313a26 100%);
    color: #efe7cf;
  }
  .strip {
    position: absolute; left: 170px; top: 55px; height: 520px; width: auto;
    transform: rotate(-4deg);
    box-shadow: 0 22px 44px rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.3);
  }
  .text { position: absolute; left: 470px; right: 40px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .std { font: 400 120px/1.1 'Pinyon Script', cursive; color: #e6cf8f; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .names { font: 400 70px/1.2 'Pinyon Script', cursive; color: #efe7cf; margin-top: 14px; }
  .rule { width: 220px; height: 2px; background: #e6cf8f; opacity: .7; margin: 30px 0 22px; }
  .date { font: 500 50px/1 'Cormorant Garamond', serif; font-variant-numeric: lining-nums; letter-spacing: .18em; padding-left: .18em; color: #efe7cf; }
</style>
<img class="strip" src="../site/assets/strip.webp" alt="">
<div class="text">
  <div class="std">Save the Date</div>
  <div class="names">Emilija &amp; Dominykas</div>
  <div class="rule"></div>
  <div class="date">2027.08.20</div>
</div>
